name: GitHub-Profile-3D-Contrib

on:
  # Main trigger: an hourly cron on the Hetzner box (paulee-services,
  # /etc/cron.d/profile-3d-tick) pushes an empty "tick" commit with a
  # repo-only deploy key. Pushes made by this workflow's own GITHUB_TOKEN
  # don't trigger it again, so there's no loop.
  push:
    branches: [main]
  # Fallback if the Hetzner box is down.
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two runs never race to push SVGs.
concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Built-in token sees the same calendar as the public profile (private
          # contributions included via the profile setting). The old fine-grained
          # PAT only covered repos it was scoped to, so new activity went missing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git pull --rebase origin main
            git push
          fi
