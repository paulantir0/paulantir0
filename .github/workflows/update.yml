name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # Off the top of the hour: GitHub delays/drops a lot of ":00" scheduled runs.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Built-in token sees the same calendar as the public profile (private
          # contributions included via the profile setting). The old fine-grained
          # PAT only covered repos it was scoped to, so new activity went missing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git pull --rebase origin main
            git push
          fi
